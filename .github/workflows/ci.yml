name: Fraud Detection CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Generate Test Dataset
        run: |
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          import pandas as pd

          path = Path("datasets/creditcard.csv")
          path.parent.mkdir(parents=True, exist_ok=True)

          if not path.exists():
              rng = np.random.default_rng(42)
              rows = 1000
              data = {
                  "Time": np.arange(rows, dtype=float),
              }

              for i in range(1, 29):
                  data[f"V{i}"] = rng.normal(size=rows)

              data["Amount"] = rng.exponential(
                  scale=50, size=rows
              )
              data["Class"] = rng.choice(
                  [0, 1], size=rows, p=[0.98, 0.02]
              )

              pd.DataFrame(data).to_csv(path, index=False)

          print(f"Test dataset ready: {path}")
          PY

      - name: Generate Feast Feature Data
        run: python ml/build_feast_data.py

      - name: Apply Feast Feature Store
        working-directory: feature_store
        run: python -m feast apply

      - name: Run Automated Tests
        run: python -m pytest -v
