name: Fraud Detection CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pyarrow scikit-learn

      - name: Generate Test Dataset
        run: |
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          import pandas as pd

          path = Path("datasets/creditcard.csv")
          path.parent.mkdir(parents=True, exist_ok=True)

          if not path.exists():
              rng = np.random.default_rng(42)
              rows = 1000

              data = {"Time": np.arange(rows, dtype=float)}

              for i in range(1, 29):
                  data[f"V{i}"] = rng.normal(size=rows)

              data["Amount"] = rng.exponential(
                  scale=50.0, size=rows
              )

              labels = np.zeros(rows, dtype=np.int64)
              labels[rng.choice(rows, size=20, replace=False)] = 1
              data["Class"] = labels

              pd.DataFrame(data).to_csv(path, index=False)

          print(f"Dataset ready: {path}")
          PY

      - name: Generate Feast Feature Data
        run: python ml/build_feast_data.py

      - name: Verify Feast Feature Data
        run: |
          python -c "from pathlib import Path; p=Path('feature_store/data/transaction_features.parquet'); assert p.is_file(), f'Missing feature data: {p}'; print(f'Feature data ready: {p}')"

      - name: Apply Feast Feature Store
        run: feast -c feature_store apply

      - name: Materialize Feast Online Features
        run: |
          feast -c feature_store materialize-incremental "$(python -c 'from datetime import datetime, timezone; print(datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%S"))')"

      - name: Train GNN Model
        run: python ml/train_gnn.py

      - name: Verify GNN Model
        run: |
          python -c "from pathlib import Path; p=Path('artifacts/fraud_gnn.pt'); assert p.is_file(), f'Missing trained GNN model: {p}'; print(f'GNN model ready: {p}')"

      - name: Run Automated Tests
        run: python -m pytest -v
