```yaml
name: Fraud Detection CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Verify Project Files
        run: |
          test -f feature_store/feature_store.yaml
          test -f feature_store/feature_views.py
          test -f feature_store/test_feature_store.py
          test -f ml/build_feast_data.py

      - name: Generate Feast Feature Data
        run: python ml/build_feast_data.py

      - name: Register Feast Features
        working-directory: feature_store
        run: feast apply

      - name: Populate Feast Online Store
        working-directory: feature_store
        run: feast materialize-incremental "$(date -u +%Y-%m-%dT%H:%M:%S)"

      - name: Run Tests
        run: python -m pytest -v
```
